services:
  - type: web
    name: lasnubeshostal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: STRIPE_API_KEY
        sync: false
    plan: free
